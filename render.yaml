services:
  - type: web
    name: cure-math-ai
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: OLLAMA_MODEL
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o
      - key: HF_API_TOKEN
        sync: false
      - key: HF_MODEL
        value: Qwen/Qwen2.5-Math-7B-Instruct
      - key: AI_PROVIDER
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5
